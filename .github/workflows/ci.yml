name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Test
        run: go test -race ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fetch country database
        run: make geo
      - name: Test with the country database
        if: matrix.goarch == 'amd64'
        run: go test -tags embedgeo ./internal/geo
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -tags embedgeo -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" -o dist/goodwill-linux-${{ matrix.goarch }} ./cmd/goodwill
      - uses: actions/upload-artifact@v4
        with:
          name: goodwill-linux-${{ matrix.goarch }}
          path: dist/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t goodwill:ci --build-arg VERSION=${GITHUB_SHA::7} .
      - name: Smoke test
        run: |
          docker run -d --name goodwill -p 127.0.0.1:8080:8080 goodwill:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/api/heartbeat && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/heartbeat
          docker exec goodwill /goodwill health
          docker exec goodwill /goodwill site add --name "CI"
          docker exec goodwill /goodwill backup /data/ci-backup.db
          docker logs goodwill
